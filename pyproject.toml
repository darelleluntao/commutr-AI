[project]
name = "commutr-ai"
version = "0.1.0"
description = "Local Ollama-based AI agent for read-only Commutr API queries"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "requests>=2.31",
]

[project.scripts]
commutr-agent = "agent:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]
